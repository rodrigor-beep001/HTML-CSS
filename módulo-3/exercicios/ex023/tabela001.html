<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabelas</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    table {
      width: 300px;
      text-align: center;
      border-collapse: collapse;
      border: 5px solid blue;
    }

    tr.linha {
      background-color: gray;
    }

    td {
      border: 1px solid black;
      padding: 8px;
    }

    td.kboom {
      background-image: radial-gradient(#ff9900, #aa4000, #aa0000);
    }
  </style>
</head>

<body>
  <h1>Minha primeira tabela</h1>

  <!--
  HIERARQUIA DE TABELAS (simples)
  TABLE = tabela
    TABLE ROW = linha de tabela
      TABLE HEADER = cabe;alho de tabela
        TABLE DATA = dados de tabela
    -->

  <table>
    <tr> <!-- Primeira linha -->
      <td>A1</td>
      <td>B1</td>
      <td>C1 </td>
    </tr>
    <tr class="linha">
      <td>A2</td>
      <td>B2</td>
      <td>C2</td>
    <tr class="linha">
      <td>A3</td>
      <td>B3</td>
      <td>C3 </td>
    </tr>
    <tr>
      <td>A4</td>
      <td>B4</td>
      <td class="kboom">C4</td>
    </tr>
  </table>
</body>

</html>
