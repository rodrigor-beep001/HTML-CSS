<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo de Formulário</title>
</head>

<body>
  <h1>Exemplo de Formulário</h1>

  <form action="cadastro.php" method="get" autocomplete="on">

    <p>
      <label for="iano">Que ano você nasceu?</label>
      <input type="number" name="ano" id="iano" min="1906" max="2026" oninput="calcIdade()">
    </p>

    <p>
      <label for="iage">Sua Idade é: </label>
      <output id="iage">0</output>
    </p>

    <p>
      <input type="button" value="Salvar">
      <input type="reset" value="Limpar">
    </p>
  </form>

  <script>
    function calcIdade() {
      let atual = new Date().getFullYear()
      iage.innerHTML = Number(atual) - Number(iano.value)
    }
  </script>

</body>

</html>
