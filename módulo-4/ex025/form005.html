<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário</title>
</head>

<body>
  <h1>Exemplo de Formulário</h1>
  <form action="cadastro.php" method="get" autocomplete="on">

    <fieldset>
      <legend>Gênero</legend>
      <input type="radio" name="gen" id="ifem" value="M"> <label for="ifem">Feminino</label> <br>
      <input type="radio" name="gen" id="imasc" value="F"> <label for="imasc">Masculino</label> <br>
      <input type="radio" name="gen" id="ipnr" checked value="PNR"> <label for="ipnr">Prefiro náo responder</label>
    </fieldset>

    <fieldset>
      <legend>Esportes Favoritos</legend>
      <input type="checkbox" name="esbas" id="iesbas"> <label for="iesbas">Basquete</label> <br>
      <input type="checkbox" name="esfut" id="iesfut"> <label for="iesfut">Futebol</label> <br>
      <input type="checkbox" name="esnat" id="iesnat"> <label for="iesnat">Natação</label> <br>
      <input type="checkbox" name="esften" id="iesten"> <label for="iesten">Tênis</label>
    </fieldset>

    <p>
      <input type="submit" value="Enviar">
      <input type="reset" value="Limpar">
    </p>
  </form>
</body>

</html>
